version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/jenkins   # 경로를 backend로 변경
    overwrite: true

permissions:    # 파일 권한 설정 추가
  - object: /home/ubuntu/jenkins
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    mode: 755

hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 300
      runas: ubuntu    # 실행 사용자 지정

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: ubuntu